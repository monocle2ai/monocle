# A seed: the agent in a sentence, what users come to it to do, what it refuses.
# test_scenarios.py turns it into scenarios on the first run and caches them in
# scenarios.json beside this file; later runs reuse that until the seed changes.

agent: A travel booking agent that books flights between airports and hotels in a city.

goals:
  - Book a flight from Bombay to Hyderabad on 22 Oct 2026
  - Book a hotel in Mumbai for 27 Nov 2026

out_of_scope: [refunds, visa advice]
