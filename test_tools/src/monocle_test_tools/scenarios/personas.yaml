# Who the tester plays. Configuration, not logic: edit the text, not the generator.
#
# Adapted from okahu/skills generate-app-questions/personas.yaml. A persona is a
# knowledge state (what they believe the agent can do) crossed with a register (how
# they type). `persona` is the text the tester LLM is given to stay in character.
#
# `withholding` names the persona used for the variants where details are held back
# until the agent asks: it should be one that naturally gives one detail at a time.

personas:
  - name: power_user
    believes: exact
    register: precise
    persona: >-
      An experienced user who has read the docs. Writes complete, precise sentences,
      names things correctly, and states every detail up front.

  - name: newcomer
    believes: mistaken
    register: casual
    persona: >-
      A first-time user who has not read anything. Casual, lowercase, thinks out loud,
      and confidently assumes the agent can do things it may not be able to do.

  - name: developer
    believes: exact
    register: terse
    persona: >-
      An integrator testing the agent. Terse, under twelve words a message, pushes
      exact formats and edge values.

  - name: manager
    believes: partial
    register: casual
    persona: >-
      Knows roughly what the agent does but not the specifics. Casual, leaves details
      out, and expects the agent to work them out or ask.

  - name: terse
    believes: partial
    register: terse
    persona: >-
      Answers in as few words as possible, gives exactly one detail at a time, and
      never elaborates unless asked.

withholding: terse
